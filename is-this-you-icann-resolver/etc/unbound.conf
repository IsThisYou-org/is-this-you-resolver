server:
	interface: 0.0.0.0
	port: 53
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: 10.0.0.0/8 allow
	access-control: 172.16.0.0/12 allow
	access-control: 192.168.0.0/16 allow
	username: ""
	chroot: ""
	directory: "/opt/data"
	pidfile: "/dev/shm/unbound.pid"
	logfile: ""
	use-syslog: yes
	verbosity: 1
	so-sndbuf: 0
	so-rcvbuf: 0
	trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
	hide-identity: yes
	hide-version: yes

auth-zone:
	name: "."
	# xfr.lax.dns.icann.org, xfr.cjr.dns.icann.org, c.root-servers.net, f.root-servers.net
	primary: 192.0.32.132
	primary: 192.0.47.132
	primary: 192.33.4.12
	primary: 192.5.5.241
	zonemd-check: yes
	for-downstream: yes
	for-upstream: yes
	zonefile: "/opt/data/root.zone"
