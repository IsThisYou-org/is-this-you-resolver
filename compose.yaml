# Is This You resolver and DoH stack.
#
# Modes are Compose profiles: json, icann, handshake, tls-handshake, tls-icann.
# .env sets COMPOSE_PROFILES=handshake, so `docker compose up` starts
# that mode. A --profile flag replaces the list from .env.
# tls-handshake and tls-icann are the TLS stacks. There is no add-on tls profile.
#
# Images, ports, volume paths, and environment variables come from the
# component repositories (Dockerfiles, dkrun, and READMEs). Addresses on
# the resolver network are integration glue: see README.md.
# is-this-you-icann-resolver/ is the image source, kept together so it
# can move into its own repository. This file does not build it.

name: is-this-you-resolver

networks:
  resolver:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.53.0/24

services:
  handshake-full-node:
    profiles: ["handshake", "tls-handshake"]
    image: jamesstevens/handshake-full-node
    container_name: handshake-full-node
    read_only: true
    restart: unless-stopped
    networks:
      resolver:
        ipv4_address: 172.30.53.10
    # Chain in /opt/data/hsd, syslog in /opt/data/logs.
    # DATA_DIR moves the whole host tree, including this directory.
    volumes:
      - ${DATA_DIR:-./data}/handshake-full-node:/opt/data

  ethereum-dns-gateway:
    profiles: ["handshake", "tls-handshake"]
    image: jamesstevens/ethereum-dns-gateway
    container_name: ethereum-dns-gateway
    read_only: true
    restart: unless-stopped
    networks:
      resolver:
        ipv4_address: 172.30.53.50
    # UDP/53 on this network only. Logs match the other services.
    environment:
      # Empty when the host does not set them.
      # ETH_RPC_URL wins. Then ALCHEMY_API_CODE. Else the public RPC.
      ETH_RPC_URL: "${ETH_RPC_URL:-}"
      ALCHEMY_API_CODE: "${ALCHEMY_API_CODE:-}"
    volumes:
      - ${DATA_DIR:-./data}/ethereum-dns-gateway:/opt/data

  handshake-volume-resolver:
    profiles: ["handshake", "tls-handshake"]
    image: jamesstevens/handshake-volume-resolver
    container_name: handshake-volume-resolver
    read_only: true
    restart: unless-stopped
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 15000
        hard: 15000
    depends_on:
      - handshake-full-node
      - ethereum-dns-gateway
    networks:
      resolver:
        ipv4_address: 172.30.53.20
    environment:
      # No port: root_proxy uses 53, where rd_bit_proxy listens.
      HSD_MASTERS: "172.30.53.10"
      # No port: the gateway listens on UDP 53. IP list, semicolon separated.
      ETH_MASTERS: "172.30.53.50"
    volumes:
      - ${DATA_DIR:-./data}/handshake-volume-resolver:/opt/data
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80"
      - "127.0.0.1:9119:9119"
      - "127.0.0.1:8405:8405"
      - "127.0.0.1:8083:8083"

  is-this-you-icann-resolver:
    profiles: ["icann", "tls-icann"]
    image: jamesstevens/is-this-you-icann-resolver
    container_name: is-this-you-icann-resolver
    read_only: true
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    networks:
      resolver:
        ipv4_address: 172.30.53.60
    volumes:
      - ${DATA_DIR:-./data}/is-this-you-icann-resolver:/opt/data
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "127.0.0.1:9167:9167"

  # One container name, three service keys: the environment differs by mode,
  # and only one mode is started. The container is always json-doh-proxy.
  # Together the keys cover json, icann, handshake, tls-icann, tls-handshake.
  json-doh-proxy:
    profiles: ["handshake", "tls-handshake"]
    image: jamesstevens/json-doh-proxy
    container_name: json-doh-proxy
    read_only: true
    restart: unless-stopped
    depends_on:
      - handshake-volume-resolver
    networks:
      resolver:
        ipv4_address: 172.30.53.30
    environment:
      DOH_SERVERS: "172.30.53.20"
    ports:
      - "8080:80"

  json-doh-proxy-json:
    profiles: ["json"]
    image: jamesstevens/json-doh-proxy
    container_name: json-doh-proxy
    read_only: true
    restart: unless-stopped
    networks:
      resolver:
        ipv4_address: 172.30.53.30
    environment:
      # DoH upstreams. LOCAL_ICANN_ROOT is left unset.
      DOH_SERVERS: "https://dns.google/dns-query,https://cloudflare-dns.com/dns-query"
    ports:
      - "8080:80"

  json-doh-proxy-icann:
    profiles: ["icann", "tls-icann"]
    image: jamesstevens/json-doh-proxy
    container_name: json-doh-proxy
    read_only: true
    restart: unless-stopped
    depends_on:
      - is-this-you-icann-resolver
    networks:
      resolver:
        ipv4_address: 172.30.53.30
    environment:
      DOH_SERVERS: "172.30.53.60"
      LOCAL_ICANN_ROOT: "172.30.53.60"
    ports:
      - "8080:80"

  easy-nginx:
    image: jamesstevens/easy-nginx
    container_name: easy-nginx
    profiles: ["tls-handshake", "tls-icann"]
    read_only: true
    restart: unless-stopped
    depends_on:
      json-doh-proxy:
        condition: service_started
        required: false
      json-doh-proxy-icann:
        condition: service_started
        required: false
      handshake-volume-resolver:
        condition: service_started
        required: false
    networks:
      resolver:
        ipv4_address: 172.30.53.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_DIR:-./data}/easy-nginx:/opt/data
